<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página/aba idêntico ao da imagem -->
    <title>Qual o seu Time do Coração?</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 30px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        select {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 2px;
            width: 150px;
        }

        button {
            font-family: Arial, sans-serif;
            font-size: 13px;
            padding: 3px 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Título Principal -->
    <h1>Qual o seu Time do Coração?</h1>

    <!-- Formulário -->
    <form id="formTime">
        <div class="container">
            <!-- Caixas de Seleção (Dropdown) -->
            <select id="time" name="time">
                <option value="Botafogo">Botafogo</option>
                <option value="Flamengo">Flamengo</option>
                <option value="Fluminense">Fluminense</option>
                <option value="Vasco da Gama">Vasco da Gama</option>
            </select>

            <!-- Botões -->
            <button type="button" onclick="exibirTime()">Enviar</button>
            <button type="button" onclick="cancelar()">Cancelar</button>
        </div>
    </form>

    <!-- JavaScript Embutido -->
    <script>
        function exibirTime() {
            // Obtém o elemento <select>
            var select = document.getElementById("time");
            // Obtém o valor do time selecionado
            var timeSelecionado = select.options[select.selectedIndex].text;
            
            // Abre uma caixa de diálogo com o resultado
            alert("Seu time do coração é: " + timeSelecionado + "!");
        }

        function cancelar() {
            // Abre uma caixa de diálogo notificando o cancelamento
            alert("Seleção cancelada.");
        }
    </script>

</body>
</html>
